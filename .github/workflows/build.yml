name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Gotcha CI (herite de Krea) : le runner n'a que ~14 Go libres -> No space left.
      # Purger les toolchains inutiles avant le build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/moltowski/comfyui-serverless-h3:latest
          # mode=min (pas max) : max exporte toutes les couches intermediaires et sature le cache.
          cache-from: type=gha
          cache-to: type=gha,mode=min
